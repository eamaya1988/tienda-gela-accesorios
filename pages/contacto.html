  <!-- Contenido Principal -->

  <!-- Requisito 1: Formulario de Contacto conectado a Formspree -->
  <section class="contact-section">
    <!-- CORRECCIÓN: Dejamos el h2 aquí afuera y usamos la clase BEM correspondiente -->
    <h2 class="contact-section__title">Envíanos tu consulta</h2>
    
    <!-- Formulario con Formspree -->
    <form action="https://formspree.io/f/xkjgybko" method="POST" class="contact-form">
      
      <!-- Nombre -->
      <div class="contact-form__group">
        <label for="nombre" class="contact-form__label">Nombre completo:</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          class="contact-form__input" 
          placeholder="Ej: Sofía Pérez" 
          required
          aria-required="true">
      </div>

      <!-- Correo electrónico -->
      <div class="contact-form__group">
        <label for="email" class="contact-form__label">Correo electrónico:</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="contact-form__input" 
          placeholder="tucorreo@ejemplo.com" 
          required
          aria-required="true">
      </div>

      <!-- Teléfono -->
      <div class="contact-form__group">
        <label for="telefono" class="contact-form__label">Teléfono:</label>
        <input 
          type="tel" 
          id="telefono" 
          name="telefono" 
          class="contact-form__input" 
          placeholder="11-3456-7890" 
          required
          aria-required="true">
      </div>

      <!-- Pregunta Desplegable (Radio) -->
      <div class="contact-form__group">
        <fieldset class="contact-form__fieldset">
          <legend class="contact-form__label">¿Tiene un número de pedido?</legend>
          
          <div class="contact-form__radio-wrapper">
            <div class="contact-form__radio-option">
              <input type="radio" name="tiene_pedido" id="radio-si" value="si">
              <label for="radio-si">Sí</label>
            </div>
            
            <div class="contact-form__radio-option">
              <input type="radio" name="tiene_pedido" id="radio-no" value="no" checked>
              <label for="radio-no">No</label>
            </div>
          </div>

          <!-- Bloque desplegable por CSS -->
          <div class="contact-form__pedido-desplegable">
            <label for="numero_pedido" class="contact-form__label">Número de pedido:</label>
            <input 
              type="text" 
              id="numero_pedido" 
              name="numero_pedido" 
              class="contact-form__input" 
              placeholder="Ej: #1234">
          </div>
        </fieldset>
      </div>

      <!-- Motivo de consulta -->
      <div class="contact-form__group">
        <label for="motivo_consulta" class="contact-form__label">Motivo de consulta:</label>
        <select id="motivo_consulta" name="motivo_consulta" class="contact-form__input" required aria-required="true">
          <option value="" disabled selected hidden>Seleccioná una opción...</option>
          <option value="consulta">Consulta</option>
          <option value="reclamo">Reclamo</option>
          <option value="sugerencia">Sugerencia</option>
          <option value="pedido_personalizado">Pedido personalizado</option>
          <option value="cambios_devoluciones">Cambios o devoluciones</option>
          <option value="otro">Otro motivo</option>
        </select>
      </div>

      <!-- Mensaje -->
      <div class="contact-form__group">
        <label for="mensaje" class="contact-form__label">Mensaje o detalle del pedido:</label>
        <textarea 
          id="mensaje" 
          name="mensaje" 
          rows="5" 
          class="contact-form__textarea" 
          placeholder="Contanos qué pieza te interesa (aros, pulseras, collares) o tu consulta..." 
          required
          aria-required="true"></textarea>
      </div>

      <!-- Checkbox Boletín de noticias -->
      <div class="contact-form__group contact-form__group--checkbox">
        <input type="checkbox" id="suscribir" name="suscripcion" value="activo">
        <label for="suscribir">Acepto recibir el boletín de noticias</label>
      </div>        

      <!-- Botón de Envío -->
      <button type="submit" class="contact-form__button">Enviar Mensaje</button>
    </form>
  </section>

</main>
